name: CI - Dev Branch Pipeline

on:
  push:
    branches: [ "dev-branch" ]
  pull_request:
    branches: [ "dev-branch" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install matplotlib pillow flake8 pytest
    - run: flake8 . --exclude=.venv,.git --count --select=E9,F63,F7,F82 --show-source --statistics
    - run: python annotate_frame_corner.py
    - run: |
        if [ -d "tests" ] || [ -f "test_*.py" ]; then pytest; else echo "No tests found"; fi
